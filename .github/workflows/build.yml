name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: backend
        run: |
          dotnet restore
          dotnet publish ToriiHub.Api/ToriiHub.Api.csproj \
            -c Release \
            -o ../publish \
            /p:UseAppHost=false

      - name: Copy frontend into wwwroot
        run: cp -r frontend/dist/* publish/wwwroot/ || mkdir -p publish/wwwroot && cp -r frontend/dist/* publish/wwwroot/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toriihub-publish
          path: publish/
          retention-days: 7